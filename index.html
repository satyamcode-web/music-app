<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player.APP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>🎵 Music Player</h1>

        <button id="theme-btn">🌙 Theme</button>

    </header>


    <!-- Main -->
    <main>

        <!-- LEFT: Songs -->
        <section id="song-section">

            <h2>All Songs</h2>

            <label for="genre">Genre:</label>

            <select id="genre">

                <option value="all">All</option>
                <option value="pop">Pop</option>
                <option value="hip-hop">Hip Hop</option>
                <option value="rock">Rock</option>
                <option value="jazz">Jazz</option>

            </select>


            <div id="songs-list"></div>

        </section>



        <!-- MIDDLE: Player -->
        <section id="player-section">

            <img
                id="song-image"
                src="image/images (1).jpeg"
                alt="song-image"
            >


            <h2 id="song-name">Song Name</h2>

            <p id="artist-name">Artist Name</p>


            <audio id="audio-player" controls>

                Your browser does not support the audio element.

            </audio>


            <div id="player-buttons">

                <button id="previous-btn">
                    Previous
                </button>

                <button id="play-btn">
                    Play
                </button>

                <button id="next-btn">
                    Next
                </button>

            </div>


            <button id="add-playlist-btn">
                ➕ Add to Playlist
            </button>

        </section>



        <!-- RIGHT: Playlist -->
        <section id="playlist-section">

            <h2>Playlist</h2>


            <div class="create-playlist">

                <input
                    type="text"
                    id="playlist-input"
                    placeholder="Enter playlist name"
                >

                <button id="create-playlist-btn">
                    Create
                </button>

            </div>


            <h3>My Playlists</h3>

            <div id="playlists"></div>


            <h3>Playlist Songs</h3>

            <div id="playlist-songs"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
